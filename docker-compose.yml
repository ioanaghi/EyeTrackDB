name: eyetrackdb

services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: eyetrackdb-postgres:17-cron
    container_name: eyetrackdb-postgres
    restart: unless-stopped

    # Explicit settings also upgrade volumes initialized with the stock image.
    # Background workers avoid separate loopback password configuration for cron.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=eyetrackdb
      - -c
      - cron.timezone=Europe/Bucharest
      - -c
      - cron.use_background_workers=on

    environment:
      POSTGRES_DB: eyetrackdb
      POSTGRES_USER: eyetrack
      POSTGRES_PASSWORD: eyetrack_dev_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./sql:/sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyetrack -d eyetrackdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
